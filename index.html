    /* ============ 9. ÉCRAN DE JEU : ÉTAT + MÉCANIQUE DE LANCER ============ */
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const meterWrap = document.getElementById("meter-wrap");
    const meterFill = document.getElementById("meter-fill");
    const meterMarker = document.getElementById("meter-marker");
    const hintText = document.getElementById("hint-text");
    const resultPanel = document.getElementById("result-panel");

    let trousseImg = new Image();
    trousseImg.src = "trousse-skin-1.png";

    function resizeCanvas() {
        canvas.width = canvas.clientWidth * devicePixelRatio;
        canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    window.addEventListener("resize", resizeCanvas);
    // Sur mobile, les dimensions ne sont pas toujours à jour au moment même de
    // l'évènement "orientationchange" (rotation d'écran) : un petit délai laisse
    // le navigateur finir de recalculer la taille de la fenêtre avant de redessiner.
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 200));

    // Machine à états du lancer : idle -> charging_power -> charging_angle -> flying -> landed
    let state = "idle";
    let worldX = 0;       // distance horizontale parcourue (px, espace "monde")
    let worldY = 0;       // hauteur au-dessus du sol (px), 0 = au sol
    let vx = 0, vy = 0;   // vitesse horizontale / verticale (px/s). vy positif = vers le haut
    let currentG = BASE_G; // gravité du lancer en cours (dépend du niveau de Vitesse)
    let rotation = 0;     // angle de rotation actuel de la trousse (radians)
    let rotSpeed = 0;     // vitesse de rotation du lancer en cours (radians/s)
    let cameraX = 0;      // décalage de caméra pour suivre la trousse pendant le vol
    let t0 = 0;           // horodatage du début de la phase en cours (charge / précision)
    let lastFrameTime = 0;
    let lockedPower = 0;    // puissance verrouillée (0.4 à 1.0) lors du 1er clic
    let lockedAccuracy = 0; // précision verrouillée (-1 à 1) lors du 2e clic
    let isPerfect = false;  // vrai si le lancer était quasi-parfait (bonus d'argent)
    let groundScreenY = 0;  // position Y du sol à l'écran (recalculée à chaque frame)

    // Easter egg "vers l'espace" (voir SPACE_EGG_* plus haut)
    let spaceEggTriggered = false; // ce lancer va-t-il basculer en mode espace à l'apogée ?
    let inSpaceMode = false;       // le décor actuellement affiché est-il celui de l'espace ?
    let phaseTimer = 0;            // chronomètre des phases spéciales (transition/flottaison/QTE)
    let qteResults = [];           // un booléen par anneau déjà résolu (true = réussi), longueur <= QTE_RING_COUNT
    let craterWorldX = null;       // position (world space) du cratère d'impact, null = aucun
    let trailPoints = [];          // positions récentes {x, y} pour dessiner la traînée derrière la trousse

    // Remet tout à zéro pour un nouveau lancer et démarre la boucle de rendu
    function resetThrow() {
        state = "idle";
        worldX = 0;
        worldY = 0;
        vx = 0; vy = 0;
        rotation = 0;
        cameraX = 0;
        spaceEggTriggered = false;
        inSpaceMode = false;
        phaseTimer = 0;
        qteResults = [];
        craterWorldX = null;
        trailPoints = [];
        document.getElementById("qte-wrap").classList.remove("show");
        resultPanel.classList.remove("show");
        meterWrap.style.display = "none";
        hintText.style.display = "block";
        hintText.textContent = tr("hintCharge");
        resizeCanvas();
        requestAnimationFrame(gameLoop);
    }

    // 1er clic : démarre la barre de charge de puissance (oscille automatiquement)
    function startChargingPower() {
        if (state !== "idle") return;
        state = "charging_power";
        t0 = performance.now();
        meterWrap.style.display = "block";
        hintText.textContent = tr("hintLockPower");
    }

    // 2e clic : verrouille la puissance à l'instant présent, démarre la barre de précision
    function lockPower() {
        const t = (performance.now() - t0) / 1000;
        const frac = 0.4 + 0.6 * Math.abs(Math.sin(t * 2.6)); // oscille entre 0.4 et 1.0
        lockedPower = frac;
        state = "charging_angle";
        t0 = performance.now();
        hintText.textContent = tr("hintLockAccuracy");
        sfxCharge();
    }

    // 3e clic : verrouille la précision et calcule la vitesse initiale du lancer
    function lockAccuracyAndLaunch() {
        const t = (performance.now() - t0) / 1000;
        const value = Math.sin(t * 3.4); // -1..1, 0 = visée parfaite (angle optimal)
        lockedAccuracy = value;
        isPerfect = Math.abs(value) < 0.08;

        // Easter egg : puissance quasi max + précision verrouillée tout au
        // début de la barre (zone verte) = décollage vers l'espace à l'apogée
        spaceEggTriggered = lockedPower >= SPACE_EGG_POWER_MIN && value <= SPACE_EGG_ACCURACY_MAX;

        const puissance = totalPuissance();
        const vitesse = totalVitesse();

        // Formule de tir : plus la Puissance est haute, plus v0 est grand ;
        // plus la Vitesse est haute, plus la gravité effective est faible
        // (la trousse "flotte" plus longtemps et va donc plus loin).
        const v0 = BASE_V0 * (1 + puissance * 0.12) * lockedPower;
        const angleDeg = 45 - value * 16; // 45° = angle optimal, la précision l'écarte de ±16°
        const angleRad = angleDeg * Math.PI / 180;
        currentG = BASE_G / (1 + vitesse * 0.09);

        // vy positif car worldY augmente vers le haut (voir worldToScreen plus bas) ;
        // c'est la gravité (currentG, soustraite chaque frame) qui la ramènera au sol.
        vx = v0 * Math.cos(angleRad);
        vy = v0 * Math.sin(angleRad);

        rotSpeed = 6 + v0 / 55;
        state = "flying";
        meterWrap.style.display = "none";
        hintText.style.display = "none";
        sfxLaunch();
    }

    // Un clic/tap ou la touche Espace fait avancer la machine à états d'une étape
    canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        handleTap();
    });
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && screens.game.classList.contains("active")) {
            e.preventDefault();
            handleTap();
        }
    });

    function handleTap() {
        if (state === "idle") startChargingPower();
        else if (state === "charging_power") lockPower();
        else if (state === "charging_angle") lockAccuracyAndLaunch();
        else if (state === "qte") {
            // réussi seulement si l'anneau qui rétrécit est proche de la cible fixe
            const hit = Math.abs(currentQteRingRadius() - QTE_RING_TARGET) <= QTE_RING_TOLERANCE;
            advanceQteRing(hit);
        }
        else if (state === "landed") { /* rien à faire, les boutons du panneau de résultat gèrent la suite */ }
    }

    // Résout le QTE de l'easter egg spatial : succès (tap/touche à temps) envoie
    // la trousse à vitesse folle droit devant, échec (temps écoulé) la laisse
    // simplement retomber depuis sa position actuelle.
    // Résout l'anneau en cours (touché ou raté), met à jour les petits points
    // de progression, puis passe au suivant ou termine la séquence.
    function advanceQteRing(hit) {
        if (state !== "qte" || qteResults.length >= QTE_RING_COUNT) return;
        qteResults.push(hit);
        if (hit) sfxCharge(); else sfxError();
        renderQteDots();

        if (qteResults.length >= QTE_RING_COUNT) {
            finishQte();
        } else {
            phaseTimer = 0; // relance un nouvel anneau
        }
    }

    // Une fois les QTE_RING_COUNT anneaux résolus : le boost final dépend du
    // nombre de réussites. Même un échec complet donne un petit boost (30%),
    // pour que le joueur "aille juste moins loin" plutôt que de tout perdre.
    function finishQte() {
        document.getElementById("qte-wrap").classList.remove("show");
        const hits = qteResults.filter(Boolean).length;
        const boostFactor = 0.3 + 0.7 * (hits / QTE_RING_COUNT);
        vx = SPACE_BOOST_VX * boostFactor;
        vy = SPACE_BOOST_VY;
        if (hits === QTE_RING_COUNT) sfxRecord(); // combo parfait
        state = "flying";
    }

    // Reconstruit les petits points (gris = à venir, vert = réussi, rouge = raté)
    function renderQteDots() {
        const wrap = document.getElementById("qte-dots");
        wrap.innerHTML = "";
        for (let i = 0; i < QTE_RING_COUNT; i++) {
            const dot = document.createElement("div");
            dot.className = "qte-dot" + (i < qteResults.length ? (qteResults[i] ? " hit" : " miss") : "");
            wrap.appendChild(dot);
        }
    }

    // Met à jour la position visuelle du curseur sur la barre de charge à chaque frame
    function updateMeterUI() {
        if (state === "charging_power") {
            const t = (performance.now() - t0) / 1000;
            const frac = 0.4 + 0.6 * Math.abs(Math.sin(t * 2.6));
            meterFill.style.width = (frac * 100) + "%";
            meterMarker.style.left = (frac * 100) + "%";
        } else if (state === "charging_angle") {
            const t = (performance.now() - t0) / 1000;
            const value = Math.sin(t * 3.4); // -1..1
            const pct = (value + 1) / 2 * 100;
            meterFill.style.width = "100%";
            meterMarker.style.left = pct + "%";
        }
    }

    // Appelé dès que la trousse touche le sol : calcule la distance, l'argent
    // gagné, met à jour le record éventuel et affiche le panneau de résultat
    function onLanded() {
        state = "landed";
        const distanceMeters = worldX / SCALE;
        if (distanceMeters > save.bestDistance) {
            save.bestDistance = distanceMeters;
            document.getElementById("result-record").style.display = "block";
            sfxRecord();
            pushScoreIfRecord(distanceMeters);
        } else {
            document.getElementById("result-record").style.display = "none";
        }
        document.getElementById("result-perfect").style.display = isPerfect ? "block" : "none";

        let earn = Math.max(1, Math.round(distanceMeters * 2));
        if (isPerfect) earn = Math.round(earn * 1.3); // bonus de 30% sur un lancer parfait
        save.money += earn;

        // Récompense de palier (100m, 200m, ...) : ne se déclenche qu'une seule
        // fois par palier, même si un lancer (ex: boost spatial) en franchit
        // plusieurs d'un coup.
        const milestone = Math.floor(distanceMeters / 100);
        if (milestone > save.milestoneReached) {
            const newMilestones = milestone - save.milestoneReached;
            const milestoneBonus = 50 * newMilestones;
            save.milestoneReached = milestone;
            save.money += milestoneBonus;
            showToast("🎉 Palier des " + (milestone * 100) + "m atteint ! +" + milestoneBonus + "$");
        }

        persist();

        document.getElementById("result-distance").textContent = distanceMeters.toFixed(1);
        document.getElementById("result-earn").textContent = earn;
        document.getElementById("game-money").textContent = save.money;

        resultPanel.classList.add("show");

        if (inSpaceMode) {
            craterWorldX = worldX; // petit cratère dessiné à l'endroit du crash
            sfxCrash();
        } else {
            sfxLand();
        }
    }

    // Boutons de navigation de l'écran de jeu et du panneau de résultat
    document.getElementById("btn-throw-again").addEventListener("click", () => resetThrow());
    document.getElementById("btn-result-shop").addEventListener("click", () => showScreen("shop"));
    document.getElementById("btn-game-back").addEventListener("click", () => showScreen("menu"));
    document.getElementById("btn-shop-back").addEventListener("click", () => showScreen("menu"));
    document.getElementById("btn-shop-play").addEventListener("click", () => showScreen("game"));
    document.getElementById("btn-play").addEventListener("click", () => showScreen("game"));
    document.getElementById("btn-shop").addEventListener("click", () => showScreen("shop"));
    document.getElementById("btn-leaderboard").addEventListener("click", () => showScreen("leaderboard"));
    document.getElementById("btn-leaderboard-back").addEventListener("click", () => showScreen("menu"));

    /* ============ 10. RENDU DU DÉCOR (canvas) ============ */

    // Petit générateur pseudo-aléatoire déterministe : pour une même "seed"
    // (ici l'indice de position dans le monde), on obtient toujours la même
    // valeur entre 0 et 1. Ça évite que les bâtiments/arbres/craies changent
    // ou clignotent d'une frame à l'autre pendant que la caméra défile.
    function seededRand(seed) {
        const x = Math.sin(seed * 12.9898) * 43758.5453;
        return x - Math.floor(x);
    }

    // Modulo qui reste toujours positif (contrairement à l'opérateur % de JS,
    // qui garde le signe du dividende) : utile pour les motifs qui bouclent en
    // boucle infinie (ex: le champ d'étoiles) sans jamais sauter.
    function mod(n, m) {
        return ((n % m) + m) % m;
    }

    // Dessine un bâtiment d'école en arrière-plan (façade + toit + fenêtres + porte)
    function drawBuilding(bx, groundY, seed) {
        const brick = seededRand(seed) > 0.5; // alterne entre 2 styles de façade
        const height = 130 + seededRand(seed + 1) * 50;
        const bw = 170;
        const wallColor = brick ? "rgba(196,120,110,0.5)" : "rgba(230,230,235,0.6)";
        const roofColor = brick ? "rgba(120,60,55,0.6)" : "rgba(160,140,120,0.55)";

        ctx.fillStyle = wallColor;
        ctx.fillRect(bx, groundY - height, bw, height);

        // bande de toit
        ctx.fillStyle = roofColor;
        ctx.fillRect(bx - 6, groundY - height - 12, bw + 12, 16);

        // grille de fenêtres, certaines "allumées"
        const cols = 4, rows = Math.max(2, Math.floor((height - 30) / 38));
        for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows; r++) {
                const lit = seededRand(seed * 100 + c * 10 + r) > 0.72;
                ctx.fillStyle = lit ? "rgba(255,230,150,0.75)" : "rgba(90,110,140,0.4)";
                ctx.fillRect(bx + 14 + c * 40, groundY - height + 16 + r * 38, 24, 24);
            }
        }

        // porte d'entrée
        ctx.fillStyle = "rgba(90,60,45,0.6)";
        ctx.fillRect(bx + bw / 2 - 14, groundY - 34, 28, 34);
    }

    // Dessine un arbre simple : tronc + 3 boules de feuillage superposées
    function drawTree(sx, groundY, seed) {
        const scale = 0.85 + seededRand(seed) * 0.4; // légère variation de taille
        const trunkH = 34 * scale, trunkW = 10 * scale;
        ctx.fillStyle = "#7a5230";
        ctx.fillRect(sx - trunkW / 2, groundY - trunkH, trunkW, trunkH);

        const greens = ["#4a8f3c", "#3f7f33", "#5aa347"];
        ctx.fillStyle = greens[Math.floor(seededRand(seed + 2) * 3)];
        ctx.beginPath(); ctx.arc(sx, groundY - trunkH - 22 * scale, 24 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx - 16 * scale, groundY - trunkH - 12 * scale, 17 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 16 * scale, groundY - trunkH - 12 * scale, 17 * scale, 0, Math.PI * 2); ctx.fill();
        // petite ombre pour donner du volume au feuillage
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.beginPath(); ctx.arc(sx + 8 * scale, groundY - trunkH - 18 * scale, 14 * scale, 0, Math.PI * 2); ctx.fill();
    }

    // Dessine un dessin à la craie sur le sol (marelle, étoile, morpion ou gribouillis)
    function drawChalk(sx, groundY, seed) {
        const kind = Math.floor(seededRand(seed) * 4);
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.55)";
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.lineWidth = 2.5;
        ctx.translate(sx, groundY - 4);
        ctx.rotate((seededRand(seed + 5) - 0.5) * 0.3); // légère rotation aléatoire, effet "dessiné à la main"

        if (kind === 0) {
            // marelle
            const cellW = 26, cellH = 24;
            const layout = [[0], [-1, 1], [0], [-1, 1], [0]];
            layout.forEach((row, r) => {
                row.forEach(c => {
                    ctx.strokeRect(c * cellW - cellW / 2, -r * cellH - cellH, cellW, cellH);
                    ctx.font = "11px sans-serif";
                    ctx.fillText(String(layout.length - r), c * cellW - 4, -r * cellH - cellH / 2 + 4);
                });
            });
        } else if (kind === 1) {
            // étoile
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const px = Math.cos(a) * 16, py = Math.sin(a) * 16;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
        } else if (kind === 2) {
            // morpion (tic-tac-toe)
            for (let i = -1; i <= 1; i += 2) {
                ctx.beginPath(); ctx.moveTo(i * 12, -20); ctx.lineTo(i * 12, 20); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-20, i * 12); ctx.lineTo(20, i * 12); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(-12, -12, 6, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(18, 18); ctx.moveTo(18, 6); ctx.lineTo(6, 18); ctx.stroke();
        } else {
            // gribouillis ondulé
            ctx.beginPath();
            ctx.moveTo(-22, 0);
            for (let i = -22; i <= 22; i += 4) {
                ctx.lineTo(i, Math.sin(i * 0.5) * 8);
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    // Dessine tout le fond du niveau "Cour d'école" : ciel, bâtiments, sol,
    // craies au sol, arbres et repères de distance. Appelée à chaque frame.
    function drawBackground(w, h) {
        groundScreenY = h * 0.68;

        // ciel (dégradé bleu clair)
        const sky = ctx.createLinearGradient(0, 0, 0, groundScreenY);
        sky.addColorStop(0, "#7ec8e3");
        sky.addColorStop(1, "#d8f3ff");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, groundScreenY);

        // Bâtiments d'école au loin (défilent 4x plus lentement que le sol = effet
        // de parallaxe). bx est une fonction continue de i et parX, SANS modulo
        // dans le calcul de position : un modulo là-dedans faisait "sauter" les
        // bâtiments de tout un cran (~260px) dès que parX franchissait un multiple
        // de buildingSpacing, ce qui donnait cet effet de fond qui se recharge.
        const buildingSpacing = 260;
        const parX = cameraX * 0.25;
        const buildingStartIdx = Math.floor((parX - 220) / buildingSpacing);
        const buildingEndIdx = Math.ceil((parX + w + 40) / buildingSpacing);
        for (let i = buildingStartIdx; i <= buildingEndIdx; i++) {
            const bx = i * buildingSpacing - parX;
            if (bx < -220 || bx > w + 40) continue;
            drawBuilding(bx, groundScreenY, i);
        }

        // sol (dégradé gris)
        const groundGrad = ctx.createLinearGradient(0, groundScreenY, 0, h);
        groundGrad.addColorStop(0, "#9aa0ab");
        groundGrad.addColorStop(1, "#6f7480");
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundScreenY, w, h - groundScreenY);

        // dessins à la craie sur le sol (défilent à la même vitesse que le sol, sous la trousse)
        const chalkSpacing = 210;
        const chalkStartIdx = Math.floor(cameraX / chalkSpacing) - 1;
        for (let i = chalkStartIdx; i < chalkStartIdx + Math.ceil(w / chalkSpacing) + 2; i++) {
            const worldPos = i * chalkSpacing + (seededRand(i + 0.3) - 0.5) * 60;
            const sx = worldPos - cameraX;
            if (sx < -40 || sx > w + 40) continue;
            drawChalk(sx, h - 14, i);
        }

        // arbres plantés sur la ligne d'horizon (défilent à la même vitesse que le sol)
        const treeSpacing = 300;
        const treeStartIdx = Math.floor(cameraX / treeSpacing) - 1;
        for (let i = treeStartIdx; i < treeStartIdx + Math.ceil(w / treeSpacing) + 2; i++) {
            const worldPos = i * treeSpacing + (seededRand(i + 0.7) - 0.5) * 80;
            const sx = worldPos - cameraX;
            if (sx < -40 || sx > w + 40) continue;
            drawTree(sx, groundScreenY + 6, i);
        }

        // repères de distance tous les 10 mètres, par-dessus le reste
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.font = "12px sans-serif";
        ctx.lineWidth = 2;
        const startMeter = Math.floor((cameraX / SCALE) / 10) * 10;
        for (let m = startMeter; m < startMeter + 200; m += 10) {
            const sx = m * SCALE - cameraX;
            if (sx < -20 || sx > w + 20) continue;
            ctx.beginPath();
            ctx.moveTo(sx, groundScreenY);
            ctx.lineTo(sx, groundScreenY + 14);
            ctx.stroke();
            ctx.fillText(m + "m", sx + 4, groundScreenY + 26);
        }
    }

    // Dessine un cratère (décoratif sur la lune, ou "isImpact" pour le cratère de crash)
    function drawMoonCrater(sx, sy, radius, isImpact) {
        ctx.save();
        ctx.fillStyle = isImpact ? "rgba(40,35,45,0.55)" : "rgba(60,60,70,0.35)";
        ctx.beginPath();
        ctx.ellipse(sx, sy, radius, radius * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = isImpact ? "rgba(20,15,25,0.6)" : "rgba(40,40,50,0.3)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }

    // Décor de la séquence easter egg : ciel étoilé, planète lointaine et sol
    // lunaire cratérisé (dessiné à la place de drawBackground() une fois en
    // mode espace). Même ligne d'horizon que la cour, pour un atterrissage cohérent.
    function drawSpaceBackground(w, h) {
        groundScreenY = h * 0.68;

        const sky = ctx.createLinearGradient(0, 0, 0, groundScreenY);
        sky.addColorStop(0, "#05040f");
        sky.addColorStop(1, "#1b1240");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, groundScreenY);

        // étoiles scintillantes (légère parallaxe). Le modulo JS renvoie un
        // reste négatif pour un dividende négatif ; on le force à rester
        // positif (voir mod() plus bas) pour éviter le même genre de saut
        // que celui corrigé sur les bâtiments de la cour.
        const starParX = -cameraX * 0.05;
        for (let i = 0; i < 90; i++) {
            const sx = mod(i * 137 + starParX, w + 100) - 50;
            const sy = seededRand(i * 3.1) * groundScreenY * 0.9;
            const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 500 + i));
            ctx.fillStyle = "rgba(255,255,255," + (0.3 + 0.5 * twinkle) + ")";
            ctx.beginPath();
            ctx.arc(sx, sy, 1 + seededRand(i) * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // planète lointaine
        const planetX = w * 0.75 - cameraX * 0.1;
        ctx.fillStyle = "#c97b5f";
        ctx.beginPath();
        ctx.arc(planetX, groundScreenY * 0.25, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath();
        ctx.arc(planetX - 14, groundScreenY * 0.25 - 10, 12, 0, Math.PI * 2);
        ctx.fill();

        // sol lunaire (même dégradé gris que la cour, pour un rendu cohérent)
        const groundGrad = ctx.createLinearGradient(0, groundScreenY, 0, h);
        groundGrad.addColorStop(0, "#9aa0ab");
        groundGrad.addColorStop(1, "#6f7480");
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundScreenY, w, h - groundScreenY);

        // petits cratères décoratifs (remplacent la craie/les arbres de la cour)
        const craterSpacing = 180;
        const craterStartIdx = Math.floor(cameraX / craterSpacing) - 1;
        for (let i = craterStartIdx; i < craterStartIdx + Math.ceil(w / craterSpacing) + 2; i++) {
            const worldPos = i * craterSpacing + (seededRand(i + 0.4) - 0.5) * 60;
            const sx = worldPos - cameraX;
            if (sx < -30 || sx > w + 30) continue;
            drawMoonCrater(sx, groundScreenY + 10 + seededRand(i) * 14, 10 + seededRand(i + 1) * 8);
        }

        // cratère d'impact du crash, s'il y en a déjà un pour ce lancer
        if (craterWorldX !== null) {
            drawMoonCrater(craterWorldX - cameraX, groundScreenY + 6, 26, true);
        }
    }

    // Nuages qui balaient tout l'écran pendant la transition, pour cacher le
    // changement de décor cour <-> espace. La couverture (opacité en cloche,
    // 0 -> 1 -> 0) garantit qu'on ne voit jamais le bascule se produire.
    function drawCloudSweep(w, h, progress) {
        const coverage = Math.sin(Math.min(Math.max(progress, 0), 1) * Math.PI);
        ctx.save();
        ctx.fillStyle = "#eef3f8";
        const drift = progress * w * 1.3 - w * 0.15;
        for (let i = 0; i < 5; i++) {
            const cx = drift - i * 150;
            const cy = h * (0.15 + (i % 3) * 0.2);
            ctx.beginPath();
            ctx.arc(cx, cy, 95, 0, Math.PI * 2);
            ctx.arc(cx + 75, cy + 12, 75, 0, Math.PI * 2);
            ctx.arc(cx - 65, cy + 18, 68, 0, Math.PI * 2);
            ctx.fill();
        }
        // voile plein écran par-dessus les nuages : garantit une couverture
        // totale au milieu de la transition, quelle que soit la position des nuages
        ctx.globalAlpha = coverage;
        ctx.fillStyle = "#f4f8ff";
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    // Rayon actuel de l'anneau du QTE : décroît linéairement de QTE_RING_START
    // à 0 sur toute la durée QTE_DURATION.
    function currentQteRingRadius() {
        const t = Math.min(phaseTimer / QTE_DURATION, 1);
        return QTE_RING_START * (1 - t);
    }

    // Dessine l'anneau-cible fixe (vert) et l'anneau qui rétrécit (blanc) :
    // il faut cliquer quand les deux tailles coïncident à peu près.
    function drawQteRing(w, h) {
        const cx = w / 2, cy = h * 0.4;
        const radius = currentQteRingRadius();
        ctx.save();
        ctx.strokeStyle = "rgba(107,255,176,0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, QTE_RING_TARGET, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.95)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(radius, 2), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    /* ============ 11. RENDU DE LA TROUSSE + BOUCLE PRINCIPALE ============ */

    // Convertit une position "monde" (worldX/worldY) en position à l'écran,
    // en tenant compte du décalage de caméra et du fait que worldY augmente
    // vers le haut alors que l'écran augmente vers le bas.
    function worldToScreen(x, y) {
        return { sx: x - cameraX, sy: groundScreenY - y };
    }

    // Dessine la traînée derrière la trousse à partir des positions récentes
    // (trailPoints), en cercles qui rétrécissent et s'estompent avec l'âge.
    function drawTrail() {
        if (trailPoints.length < 2) return;
        const trail = getTrail(save.equippedTrail);
        const now = performance.now();
        for (let i = 0; i < trailPoints.length; i++) {
            const p = trailPoints[i];
            const age = (now - p.t) / 260; // 0 = tout juste posé, 1 = complètement estompé
            if (age >= 1) continue;
            const { sx, sy } = worldToScreen(p.x, p.y);
            const rgb = trail.rgb === "rainbow" ? rainbowRgb(p.t) : trail.rgb;
            ctx.fillStyle = "rgba(" + rgb + "," + (0.5 * (1 - age)) + ")";
            ctx.beginPath();
            ctx.arc(sx, sy, 10 * (1 - age), 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Petite variante "r,g,b" de rainbowOrFilter, pour la traînée arc-en-ciel
    // (conversion HSL -> RGB à la main, teinte saturée et assez claire fixe)
    function rainbowRgb(t) {
        const h = Math.floor((t / 15) % 360);
        const s = 1, l = 0.65;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let r, g, b;
        if (h < 60) { r = c; g = x; b = 0; }
        else if (h < 120) { r = x; g = c; b = 0; }
        else if (h < 180) { r = 0; g = c; b = x; }
        else if (h < 240) { r = 0; g = x; b = c; }
        else if (h < 300) { r = x; g = 0; b = c; }
        else { r = c; g = 0; b = x; }
        return Math.round((r + m) * 255) + "," + Math.round((g + m) * 255) + "," + Math.round((b + m) * 255);
    }

    function drawTrousse() {
        // petit flottement vertical purement visuel pendant la séquence spatiale
        let floatBob = 0;
        if (state === "space_floating" || state === "qte") {
            floatBob = Math.sin(performance.now() / 300) * 10;
        }
        const { sx, sy } = worldToScreen(worldX, worldY + floatBob);
        const size = 60;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(rotation); // rotation continue pendant le vol
        ctx.filter = rainbowOrFilter(getSkin(save.equippedSkin).filter, performance.now());
        if (trousseImg.complete && trousseImg.naturalWidth > 0) {
            ctx.drawImage(trousseImg, -size / 2, -size / 2, size, size);
        } else {
            // filet de sécurité si l'image n'a pas fini de charger
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(-size / 2, -size / 2, size, size);
        }
        ctx.filter = "none";
        ctx.restore();
    }

    // Boucle principale : appelée à chaque frame tant que l'écran de jeu est actif
    function gameLoop(now) {
        if (!screens.game.classList.contains("active")) return;
        if (!lastFrameTime) lastFrameTime = now;
        const dt = Math.min((now - lastFrameTime) / 1000, 0.032); // dt plafonné pour éviter les gros sauts
        lastFrameTime = now;

        const w = canvas.width / devicePixelRatio;
        const h = canvas.height / devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        ctx.clearRect(0, 0, w, h);

        if (state === "flying") {
            // intégration physique simple (méthode d'Euler) :
            // la trousse monte tant que vy > 0, la gravité la ralentit puis la fait redescendre
            worldX += vx * dt;
            worldY += vy * dt;
            vy -= currentG * dt;
            rotation += rotSpeed * dt;

            // échantillonne la position pour la traînée (voir drawTrail), en
            // gardant seulement les points assez récents pour rester visibles
            trailPoints.push({ x: worldX, y: worldY, t: now });
            trailPoints = trailPoints.filter(p => now - p.t < 260);

            if (spaceEggTriggered && vy <= 0) {
                // on vient d'atteindre l'apogée avec la combinaison easter egg :
                // on gèle la position et on bascule vers la séquence spatiale
                spaceEggTriggered = false; // ne se déclenche qu'une fois par lancer
                state = "space_transition";
                phaseTimer = 0;
            } else if (worldY <= 0 && vy < 0) {
                // atterrissage : on repasse sous le sol (worldY <= 0) en redescendant (vy < 0)
                worldY = 0;
                onLanded();
            } else {
                // la caméra suit la trousse en la gardant vers 30% de la largeur de l'écran
                const targetCamera = worldX - w * 0.3;
                cameraX = Math.max(0, targetCamera);
                document.getElementById("game-distance").textContent = Math.max(0, worldX / SCALE).toFixed(1);
            }
        } else if (state === "space_transition") {
            phaseTimer += dt;
            // le décor bascule à la moitié de la transition, pile quand les
            // nuages couvrent tout l'écran (voir drawCloudSweep) : invisible pour le joueur
            if (!inSpaceMode && phaseTimer >= CLOUD_TRANSITION_DURATION * 0.5) {
                inSpaceMode = true;
            }
            if (phaseTimer >= CLOUD_TRANSITION_DURATION) {
                state = "space_floating";
                phaseTimer = 0;
                hintText.textContent = tr("hintZeroG");
                hintText.style.display = "block";
                sfxSpace();
            }
        } else if (state === "space_floating") {
            phaseTimer += dt;
            rotation += 1.2 * dt; // tumbling lent en apesanteur
            if (phaseTimer >= SPACE_FLOAT_DURATION) {
                hintText.style.display = "none";
                state = "qte";
                phaseTimer = 0;
                qteResults = [];
                document.getElementById("qte-wrap").classList.add("show");
                renderQteDots();
            }
        } else if (state === "qte") {
            phaseTimer += dt;
            if (phaseTimer >= QTE_DURATION) {
                advanceQteRing(false); // cet anneau a fini de rétrécir sans qu'on ait cliqué = raté
            }
        }

        updateMeterUI();
        if (inSpaceMode) {
            drawSpaceBackground(w, h);
        } else {
            drawBackground(w, h);
        }
        drawTrail();
        drawTrousse();
        if (state === "space_transition") {
            drawCloudSweep(w, h, phaseTimer / CLOUD_TRANSITION_DURATION);
        } else if (state === "qte") {
            drawQteRing(w, h);
        }

        requestAnimationFrame(gameLoop);
    }

    function updateOnlineStatus(text) {
        const el = document.getElementById("online-status");

    function initFirebase() {
        if (!FIREBASE_ENABLED) {
            updateOnlineStatus(tr("onlineOfflineNoConfig"));
            return;
        }
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        updateOnlineStatus(tr("onlineConnecting"));
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) return;
            currentUser = user;
            updateOnlineStatus(tr("onlineConnected"));
            syncCloudSaveOnLogin();
        });

            console.error("Connexion Firebase échouée :", err);
            updateOnlineStatus(tr("onlineOfflineFailed"));

    // Au premier lien avec le cloud : si une sauvegarde existe déjà pour ce
    // compte anonyme, elle prend le dessus (utile si l'utilisateur revient sur
    // le même appareil/navigateur). Sinon, on envoie la sauvegarde locale
    // actuelle pour créer le document et on génère un pseudo par défaut.
    function syncCloudSaveOnLogin() {
        if (!db || !currentUser) return;
        db.collection("users").doc(currentUser.uid).get().then((doc) => {
            if (doc.exists) {
                save = Object.assign(defaultSave(), doc.data());
                localStorage.setItem(SAVE_KEY, JSON.stringify(save));
                refreshMenu();
            } else {
                if (!save.pseudo) save.pseudo = "Trousse-" + Math.floor(1000 + Math.random() * 9000);
                persist(); // écrit en local ET envoie au cloud (pushCloudSave seul aurait sauté le localStorage)
            }
            document.getElementById("leaderboard-pseudo").textContent = save.pseudo || "-";
        }).catch((err) => console.error("Lecture de la sauvegarde cloud impossible :", err));
    }

    // Envoie la sauvegarde actuelle vers Firestore. Best-effort : si Firebase
    // n'est pas connecté ou que la requête échoue (hors ligne...), on ignore
    // simplement l'erreur, ça ne doit jamais bloquer le jeu.
    function pushCloudSave() {
        if (!db || !currentUser) return;
        db.collection("users").doc(currentUser.uid).set(save, { merge: true })
            .catch((err) => console.error("Sauvegarde cloud impossible :", err));
    }

    // Met à jour l'entrée du classement (un seul document par joueur, écrasé
    // à chaque nouveau record, jamais à chaque lancer pour limiter les écritures)
    function pushScoreIfRecord(distanceMeters) {
        if (!db || !currentUser) return;
        db.collection("scores").doc(currentUser.uid).set({
            pseudo: save.pseudo || "Anonyme",
            bestDistance: distanceMeters,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true }).catch((err) => console.error("Envoi du score impossible :", err));
    }

    // Affiche le pseudo actuel et (re)charge le classement à l'ouverture de l'écran

    // Charge et affiche le top 15 des meilleures distances, tous joueurs confondus
    function loadLeaderboard() {
        const body = document.getElementById("leaderboard-body");
        if (!FIREBASE_ENABLED || !db) {
            body.innerHTML = '<p style="text-align:center; color: var(--text-dim);">' + tr("leaderboardUnavailable") + '</p>';
            return;
        }
        body.innerHTML = '<p style="text-align:center; color: var(--text-dim);">' + tr("leaderboardLoading") + '</p>';
        db.collection("scores").orderBy("bestDistance", "desc").limit(15).get().then((snapshot) => {
            body.innerHTML = "";
            let rank = 0;
            snapshot.forEach((doc) => {
                rank++;
                const data = doc.data();
                const row = document.createElement("div");
                row.className = "leaderboard-row" + (currentUser && doc.id === currentUser.uid ? " you" : "");
                row.innerHTML =
                    '<span class="rank">#' + rank + '</span>' +
                    '<span class="pseudo">' + (data.pseudo || "???") + '</span>' +
                    '<span class="dist">' + (data.bestDistance || 0).toFixed(1) + ' m</span>';
                body.appendChild(row);
            });
            if (rank === 0) {
                body.innerHTML = '<p style="text-align:center; color: var(--text-dim);">' + tr("leaderboardEmpty") + '</p>';
            }
        }).catch((err) => {
            console.error("Chargement du classement impossible :", err);
            body.innerHTML = '<p style="text-align:center; color: var(--text-dim);">' + tr("leaderboardError") + '</p>';
        });
    }

            icon: "🔁",
            fr: { title: "Alors partage un max !", text: "Partage le jeu à tes amis pour qu'ils puissent eux aussi battre ton record !" },
            en: { title: "So go share it!", text: "Share the game with your friends so they can try to beat your record too!" },
        },
        {
            icon: "🤗",
            fr: { title: "Visite mes autres sites !", text: "Va sur evyverse.vercel.app pour découvrir mes autres sites !" },
            en: { title: "Check out my other sites!", text: "Go to evyverse.vercel.app to discover my other projects!" },
        },
    ];
    let tutorialStep = 0;

    function renderTutorialSlide() {
        const slide = TUTORIAL_SLIDES[tutorialStep];
        const localized = slide[save.lang] || slide.fr;
        document.getElementById("tutorial-icon").textContent = slide.icon;
        document.getElementById("tutorial-title").textContent = localized.title;
        document.getElementById("tutorial-text").textContent = localized.text;

        const dots = document.getElementById("tutorial-dots");
        dots.innerHTML = "";
        TUTORIAL_SLIDES.forEach((s, i) => {
            const dot = document.createElement("div");
            dot.className = "tutorial-dot" + (i === tutorialStep ? " active" : "");
            dots.appendChild(dot);
        });

        const isLast = tutorialStep === TUTORIAL_SLIDES.length - 1;
        document.getElementById("btn-tutorial-next").textContent = isLast ? tr("tutorialDone") : tr("tutorialNext");
    }

    function closeTutorial() {
        document.getElementById("tutorial-overlay").classList.remove("show");
        save.tutorialSeen = true;
        persist();
    }

    function showTutorialIfNeeded() {
        if (save.tutorialSeen) return;
        tutorialStep = 0;
        renderTutorialSlide();
        document.getElementById("tutorial-overlay").classList.add("show");
    }

    document.getElementById("btn-tutorial-next").addEventListener("click", () => {
        if (tutorialStep < TUTORIAL_SLIDES.length - 1) {
            tutorialStep++;
            renderTutorialSlide();
        } else {
            closeTutorial();
        }
    });
    document.getElementById("btn-tutorial-skip").addEventListener("click", closeTutorial);

    // Bouton de langue : bascule FR <-> EN et retraduit toute l'interface visible
    document.getElementById("btn-lang").addEventListener("click", () => {
        save.lang = save.lang === "en" ? "fr" : "en";
        persist();
        applyLanguage();
        renderTutorialSlide(); // au cas où le tutoriel serait affiché
    });

    /* ============ 14. INITIALISATION ============ */
    // Si le joueur n'a jamais choisi de langue, on devine à partir de celle du
    // navigateur (anglais par défaut sauf si le navigateur est en français).
    if (!save.lang) {
        save.lang = navigator.language && navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";
        persist();
    }
    applyLanguage();
    buildWorldsRow();
    refreshMenu();
    if (!menuPreviewRAF) animateMenuPreview();
    showScreen("menu");
    initFirebase();
    showTutorialIfNeeded();
})();
</script>
</body>
</html>
