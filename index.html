<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="trousse-skin-1.png">
    <meta charset="UTF-8">
    <!-- maximum-scale/user-scalable=no évite le zoom involontaire au double-tap,
         viewport-fit=cover permet de gérer l'encoche des téléphones (voir env(safe-area-inset-*)) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bully the Trousse</title>
    <style>
        /* Variables de couleur réutilisées partout dans l'interface.
           Le mode clair (voir applyTheme() et [data-theme="light"] plus bas)
           ne change QUE ce thème d'interface : le décor du jeu lui-même
           (cour d'école, espace...) est dessiné en dur sur le canvas et garde
           toujours ses propres couleurs. */
        :root {
            --sky-top: #7ec8e3;
            --sky-bottom: #cdeffd;
            --ground: #8a8f98;
            --ground-dark: #6f7480;
            --panel-bg: rgba(20, 24, 36, 0.92);
            --panel-border: #3a4260;
            --accent: #ffd23f;
            --accent-2: #ff6b6b;
            --money: #6bffb0;
            --text: #f4f6ff;
            --text-dim: #aab0c8;
            --app-bg: #10131c;
            --shop-bg: #171b28;
            --card-bg: #1f2437;
        }
        [data-theme="light"] {
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: #d8dce6;
            --text: #1a1f2e;
            --text-dim: #5c6478;
            --app-bg: #eef1f7;
            --shop-bg: #f4f6fb;
            --card-bg: #ffffff;
        }

        /* touch-action: manipulation coupe le double-tap-zoom sur mobile tout en
           gardant des taps réactifs (pas de délai de 300ms) */
        * { box-sizing: border-box; touch-action: manipulation; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 100dvh = hauteur qui tient compte de la barre d'adresse mobile qui
               apparaît/disparaît ; on garde 100% en repli pour les vieux navigateurs */
            height: 100dvh;
            overflow: hidden;
            font-family: "Segoe UI", "Trebuchet MS", Verdana, sans-serif;
            background: var(--app-bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none; /* empêche le menu "enregistrer l'image" au appui long sur iOS */
            user-select: none;
            overscroll-behavior: none; /* empêche le rebond/pull-to-refresh sur mobile */
            touch-action: manipulation; /* tape réactif, sans double-tap zoom */
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Les 3 écrans (menu / jeu / boutique) sont superposés et on affiche
           seulement celui qui a la classe "active" (voir showScreen en JS) */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
        }
        .screen.active { display: block; }

        /* ---------- ÉCRAN MENU ---------- */
        #screen-menu {
            background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 60%, var(--ground) 60%, var(--ground-dark) 100%);
        }
        .menu-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px 16px;
            gap: 10px;
        }
        .title-card {
            text-align: center;
            text-shadow: 0 3px 0 rgba(0,0,0,0.25);
        }
        .title-card h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 46px);
            color: #fff;
            letter-spacing: 1px;
        }
        .title-card p {
            margin: 2px 0 0;
            color: #2c3550;
            font-weight: 600;
            font-size: clamp(12px, 2.5vw, 15px);
        }
        .money-pill {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 999px;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 18px;
            color: var(--money);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        #trousse-preview-wrap {
            width: min(38vw, 220px);
            height: min(38vw, 220px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 12px rgba(0,0,0,0.3));
            animation: floaty 2.6s ease-in-out infinite;
        }
        #trousse-preview-wrap img { width: 100%; height: 100%; object-fit: contain; }
        /* Petite animation de flottement pour la trousse affichée dans le menu */
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .stats-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-chip {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .stat-chip b { color: var(--accent); }
        .btn {
            border: none;
            border-radius: 14px;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            color: #1a1a1a;
            background: var(--accent);
            box-shadow: 0 5px 0 #c79a1f, 0 8px 14px rgba(0,0,0,0.25);
            transition: transform 0.08s ease;
            letter-spacing: 0.5px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c79a1f, 0 3px 6px rgba(0,0,0,0.2); }
        .btn.secondary {
            background: #4b5570;
            color: #fff;
            box-shadow: 0 5px 0 #2f374a, 0 8px 14px rgba(0,0,0,0.25);
        }
        .btn.secondary:active { box-shadow: 0 1px 0 #2f374a, 0 3px 6px rgba(0,0,0,0.2); }
        /* padding un peu généreux pour rester confortable au doigt sur mobile */
        .btn.small { padding: 10px 18px; font-size: 14px; border-radius: 10px; }
        .menu-buttons { display: flex; gap: 14px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

        /* Rangée des "mondes" (niveaux) en bas du menu */
        .worlds-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 520px;
        }
        .world-card {
            width: 108px;
            padding: 10px 6px;
            border-radius: 12px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            text-align: center;
            cursor: pointer;
        }
        .world-card.locked { opacity: 0.55; cursor: not-allowed; }
        .world-card .emoji { font-size: 26px; }
        .world-card .name { font-size: 12px; font-weight: 700; margin-top: 4px; }
        .world-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }

        /* ---------- ÉCRAN DE JEU ---------- */
        /* Tout le décor + la trousse sont dessinés dans ce <canvas> en JS */
        #screen-game canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* aucun geste natif (scroll/zoom) : tous les taps sont gérés en JS */
            touch-action: none;
        }
        /* calc(...) + env(safe-area-inset-top) pousse le HUD sous l'encoche
           des téléphones (iPhone) au lieu de passer dessous */
        .hud-top {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            right: calc(10px + env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-top > * { pointer-events: auto; }
        .hint-text {
            position: absolute;
            bottom: 90px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(14px, 3vw, 20px);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        /* Prompt du QTE de l'easter egg spatial (l'anneau lui-même est dessiné
           sur le canvas, voir drawQteRing) */
        #qte-wrap {
            position: absolute;
            left: 50%;
            top: 20%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 15;
        }
        #qte-wrap.show { display: block; }
        #qte-prompt {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 3px 10px rgba(0,0,0,0.6);
            animation: qtePulse 0.35s ease-in-out infinite alternate;
        }
        @keyframes qtePulse {
            from { transform: scale(1); }
            to { transform: scale(1.12); }
        }
        /* Petits points indiquant la réussite/l'échec de chaque anneau de la séquence */
        #qte-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }
        .qte-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
        }
        .qte-dot.hit { background: var(--money); border-color: var(--money); }
        .qte-dot.miss { background: var(--accent-2); border-color: var(--accent-2); }

        /* Barre de charge affichée pendant les phases "puissance" et "précision" */
        #meter-wrap {
            position: absolute;
            left: 50%;
            bottom: calc(30px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(80vw, 420px);
            height: 26px;
            background: rgba(10,12,20,0.55);
            border: 2px solid #222633;
            border-radius: 999px;
            overflow: hidden;
            display: none;
        }
        #meter-fill {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 0%;
            background: linear-gradient(90deg, #6bffb0, var(--accent), var(--accent-2));
        }
        #meter-marker {
            position: absolute;
            top: -4px;
            width: 4px;
            height: 34px;
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }
        #meter-center {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            width: 6px;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.35);
        }

        /* Panneau affiché après l'atterrissage (distance + argent gagné) */
        .result-panel {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 18px;
            padding: 22px 28px;
            text-align: center;
            display: none;
            min-width: 260px;
            max-width: 92vw; /* évite tout débordement sur les très petits écrans */
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .result-panel.show { display: block; }
        .result-panel h2 { margin: 0 0 6px; font-size: 22px; color: var(--accent); }
        .result-panel .distance { font-size: 34px; font-weight: 900; margin: 6px 0; }
        .result-panel .earn { color: var(--money); font-weight: 700; font-size: 18px; margin-bottom: 4px; }
        .result-panel .record { color: var(--accent-2); font-weight: 800; margin-bottom: 8px; }
        .result-panel .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

        /* ---------- ÉCRAN BOUTIQUE ---------- */
        #screen-shop {
            background: var(--shop-bg);
            flex-direction: column;
        }
        /* Important : on utilise "#screen-shop.active" (un ID + une classe) plutôt
           que de remettre "display: none" ici, car un sélecteur avec ID est plus
           spécifique que ".screen.active" et gagnerait toujours, même une fois la
           classe "active" ajoutée en JS. Résultat sans ça : la boutique ne s'affiche
           jamais, sans la moindre erreur dans la console. */
        #screen-shop.active { display: flex; }
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid var(--panel-border);
            background: var(--card-bg);
            color: var(--text-dim);
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
        .shop-body { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
        .upgrade-card, .skin-card {
            background: var(--card-bg);
            border: 2px solid var(--panel-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        /* Petit "pop" joué sur la carte juste achetée/équipée (voir playPurchasePop) */
        .just-bought { animation: purchasePop 0.35s ease-out; }
        @keyframes purchasePop {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(107,255,176,0); }
            40% { transform: scale(1.045); box-shadow: 0 0 0 6px rgba(107,255,176,0.35); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(107,255,176,0); }
        }
        .upgrade-card .icon, .skin-card .icon {
            font-size: 30px;
            width: 46px;
            text-align: center;
        }
        .upgrade-card .info, .skin-card .info { flex: 1; }
        .upgrade-card .info h3, .skin-card .info h3 { margin: 0 0 4px; font-size: 15px; }
        .upgrade-card .info p, .skin-card .info p { margin: 0; font-size: 12px; color: var(--text-dim); }
        .skin-card img {
            width: 46px; height: 46px; object-fit: contain;
        }
        .level-badge {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
        }

        /* ---------- ÉCRAN CLASSEMENT ---------- */
        #screen-leaderboard {
            background: var(--shop-bg);
            flex-direction: column;
        }
        /* Même astuce de spécificité que pour #screen-shop.active, voir plus haut */
        #screen-leaderboard.active { display: flex; }
        .leaderboard-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 2px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .leaderboard-row .rank { width: 30px; color: var(--text-dim); font-weight: 700; }
        .leaderboard-row .pseudo { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .leaderboard-row .dist { color: var(--money); font-weight: 800; }
        .leaderboard-row.you { border-color: var(--accent); }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-overlay.show { display: flex; }

        /* ---------- TUTORIEL (affiché une seule fois pour les nouveaux joueurs) ---------- */
        .tutorial-box {
            position: relative;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 18px;
            padding: 30px 24px 22px;
            text-align: center;
            width: 88vw;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #btn-tutorial-skip {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .tutorial-icon { font-size: 48px; margin-bottom: 6px; }
        #tutorial-title { margin: 4px 0 10px; font-size: 20px; color: var(--accent); }
        #tutorial-text { margin: 0 0 18px; font-size: 14px; line-height: 1.5; color: var(--text); }
        .tutorial-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .tutorial-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); }
        .tutorial-dot.active { background: var(--accent); }
        /* Petit message temporaire en bas de l'écran (ex: "Pas assez d'argent !") */
        .toast {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,24,36,0.95);
            border: 2px solid var(--panel-border);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 60;
        }
        .toast.show { opacity: 1; }

        .back-btn {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
            z-index: 10;
        }
        /* Même emplacement que .back-btn mais collé à droite (ex: "Retour au jeu" dans la boutique) */
        .forward-btn {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            z-index: 10;
        }

        /* Bouton musique : visible sur les 3 écrans, en bas à droite */
        .mute-btn {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            right: calc(10px + env(safe-area-inset-right));
            z-index: 20;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--panel-border);
            background: var(--panel-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Même style que .mute-btn, juste à côté (bascule thème clair/sombre) */
        .theme-btn {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            right: calc(60px + env(safe-area-inset-right));
            z-index: 20;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--panel-border);
            background: var(--panel-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Encore à côté (bascule de langue FR/EN) */
        .lang-btn {
            position: fixed;
            bottom: calc(10px + env(safe-area-inset-bottom));
            right: calc(110px + env(safe-area-inset-right));
            z-index: 20;
            height: 42px;
            padding: 0 12px;
            border-radius: 999px;
            border: 2px solid var(--panel-border);
            background: var(--panel-bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ÉCRAN MENU -->
    <section id="screen-menu" class="screen active">
        <div class="menu-wrap">
            <div class="title-card">
                <h1>🎒 Bully the Trousse</h1>
                <p data-i18n="menuSubtitle">Lance ta trousse le plus loin possible !</p>
            </div>
            <div class="money-pill">💰 <span id="menu-money">0</span> $</div>
            <div id="trousse-preview-wrap"><img id="trousse-preview-img" src="trousse-skin-1.png" alt="trousse"></div>
            <div class="stats-row">
                <div class="stat-chip"><span data-i18n="statPuissance">Puissance</span> <b id="menu-puissance">1</b></div>
                <div class="stat-chip"><span data-i18n="statVitesse">Vitesse</span> <b id="menu-vitesse">1</b></div>
                <div class="stat-chip"><span data-i18n="statRecord">Record</span> <b id="menu-record">0 m</b></div>
            </div>
            <div class="menu-buttons">
                <button class="btn" id="btn-play" data-i18n="btnPlay">🚀 Jouer</button>
                <button class="btn secondary" id="btn-shop" data-i18n="btnShop">🛒 Boutique</button>
                <button class="btn secondary" id="btn-leaderboard" data-i18n="btnLeaderboard">🏆 Classement</button>
            </div>
            <!-- Rempli dynamiquement par buildWorldsRow() -->
            <div class="worlds-row" id="worlds-row"></div>
        </div>
    </section>

    <!-- ÉCRAN DE JEU -->
    <section id="screen-game" class="screen">
        <canvas id="game-canvas"></canvas>
        <button class="btn secondary small back-btn" id="btn-game-back" data-i18n="btnBackMenu">← Menu</button>
        <div class="hud-top">
            <div class="money-pill" style="font-size:14px; padding:6px 14px;">💰 <span id="game-money">0</span> $</div>
            <div class="money-pill" style="font-size:14px; padding:6px 14px; color:#fff;">📏 <span id="game-distance">0</span> m</div>
        </div>
        <div class="hint-text" id="hint-text" data-i18n="hintCharge">Clique / appuie pour charger la puissance !</div>
        <div id="qte-wrap">
            <div id="qte-prompt" data-i18n="qtePrompt">🚀 CLIQUE QUAND ÇA S'ALIGNE !</div>
            <div id="qte-dots"></div>
        </div>
        <div id="meter-wrap">
            <div id="meter-fill"></div>
            <div id="meter-center"></div>
            <div id="meter-marker"></div>
        </div>
        <div class="result-panel" id="result-panel">
            <div id="result-record" class="record" style="display:none;" data-i18n="resultRecord">🏆 NOUVEAU RECORD !</div>
            <div id="result-perfect" class="record" style="display:none; color:#6bffb0;" data-i18n="resultPerfect">✨ LANCER PARFAIT !</div>
            <h2 data-i18n="resultDistanceTitle">Distance parcourue</h2>
            <div class="distance"><span id="result-distance">0</span> m</div>
            <div class="earn">+<span id="result-earn">0</span> $</div>
            <div class="buttons">
                <button class="btn" id="btn-throw-again" data-i18n="btnThrowAgain">🔁 Relancer</button>
                <button class="btn secondary" id="btn-result-shop" data-i18n="btnShop">🛒 Boutique</button>
            </div>
        </div>
    </section>

    <!-- ÉCRAN BOUTIQUE -->
    <section id="screen-shop" class="screen">
        <button class="btn secondary small back-btn" id="btn-shop-back" data-i18n="btnBackMenu">← Menu</button>
        <!-- Permet de reprendre directement le jeu sans repasser par le menu -->
        <button class="btn small forward-btn" id="btn-shop-play" data-i18n="btnBackGame">🎮 Retour au jeu</button>
        <div class="shop-header" style="justify-content:center; padding-top:16px;">

            <button class="tab-btn active" id="tab-upgrades" data-i18n="shopTabUpgrades">⚙️ Améliorations</button>
            <button class="tab-btn" id="tab-skins" data-i18n="shopTabSkins">🎨 Skins</button>
            <button class="tab-btn" id="tab-trails" data-i18n="shopTabTrails">🌈 Traînées</button>
        </div>
        <!-- Rempli dynamiquement par renderShopTab() -->

    <!-- ÉCRAN CLASSEMENT (en ligne, via Firebase) -->
    <section id="screen-leaderboard" class="screen">
        <button class="btn secondary small back-btn" id="btn-leaderboard-back" data-i18n="btnBackMenu">← Menu</button>
        <div class="shop-header" style="justify-content:center; padding-top:16px; flex-direction: column; gap: 4px;">
            <div class="money-pill" data-i18n="leaderboardTitle">🏆 Classement mondial</div>
            <div id="online-status" style="font-size:12px; color: var(--text-dim);">Connexion...</div>

        </div>
        <!-- Rempli dynamiquement par loadLeaderboard() -->
        <div class="shop-body" id="leaderboard-body"></div>
    </section>

    <!-- Tutoriel affiché une seule fois, au tout premier lancement (voir showTutorialIfNeeded) -->
    <div class="modal-overlay" id="tutorial-overlay">
        <div class="tutorial-box">
            <button class="btn secondary small" id="btn-tutorial-skip" data-i18n="tutorialSkip">Passer ✕</button>
            <div class="tutorial-icon" id="tutorial-icon">🎒</div>
            <h2 id="tutorial-title"></h2>
            <p id="tutorial-text"></p>
            <div class="tutorial-dots" id="tutorial-dots"></div>
            <button class="btn" id="btn-tutorial-next">Suivant</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Musique de fond, démarrée au premier clic de l'utilisateur (voir plus bas) -->
    <audio id="bg-music" src="musique-fond.mp3" loop preload="auto"></audio>
    <button id="btn-mute" class="mute-btn" title="Couper / activer la musique">🔊</button>
    <button id="btn-theme" class="theme-btn" title="Thème clair / sombre">🌙</button>
    <button id="btn-lang" class="lang-btn" title="Changer de langue">FR</button>
</div>

<!-- SDK Firebase (compat, sans étape de build) : auth anonyme + Firestore.
     Si le réseau est coupé ou que ces scripts ne chargent pas, le jeu continue
     de fonctionner normalement en local — voir FIREBASE_ENABLED dans le script. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
(function () {
    "use strict";

    /* ============ I18N (FR/EN) ============ */
    // Dictionnaire des textes de l'interface. tr(clé) renvoie la version dans
    // la langue active (save.lang). Le contenu généré dynamiquement en JS
    // (cartes boutique, tutoriel, hints...) l'utilise directement ; le texte
    // statique du HTML porte un attribut data-i18n mis à jour par applyLanguage().
    const STRINGS = {
        menuSubtitle: { fr: "Lance ta trousse le plus loin possible !", en: "Throw your pencil case as far as you can!" },
        statPuissance: { fr: "Puissance", en: "Power" },
        statVitesse: { fr: "Vitesse", en: "Speed" },
        statRecord: { fr: "Record", en: "Record" },
        btnPlay: { fr: "🚀 Jouer", en: "🚀 Play" },
        btnShop: { fr: "🛒 Boutique", en: "🛒 Shop" },
        btnLeaderboard: { fr: "🏆 Classement", en: "🏆 Leaderboard" },
        btnBackMenu: { fr: "← Menu", en: "← Menu" },
        btnBackGame: { fr: "🎮 Retour au jeu", en: "🎮 Back to game" },
        worldLocked: { fr: " arrive bientôt !", en: " is coming soon!" },
        hintCharge: { fr: "Clique / appuie pour charger la puissance !", en: "Click / tap to charge power!" },
        hintLockPower: { fr: "Clique pour verrouiller la PUISSANCE !", en: "Click to lock in POWER!" },
        hintLockAccuracy: { fr: "Reclique pour verrouiller la PRÉCISION !", en: "Click again to lock in ACCURACY!" },
        hintZeroG: { fr: "🛸 En apesanteur...", en: "🛸 Weightless..." },
        qtePrompt: { fr: "🚀 CLIQUE QUAND ÇA S'ALIGNE !", en: "🚀 CLICK WHEN IT LINES UP!" },
        resultDistanceTitle: { fr: "Distance parcourue", en: "Distance travelled" },
        resultRecord: { fr: "🏆 NOUVEAU RECORD !", en: "🏆 NEW RECORD!" },
        resultPerfect: { fr: "✨ LANCER PARFAIT !", en: "✨ PERFECT THROW!" },
        btnThrowAgain: { fr: "🔁 Relancer", en: "🔁 Throw again" },
        notEnoughMoney: { fr: "Pas assez d'argent !", en: "Not enough money!" },
        shopTabUpgrades: { fr: "⚙️ Améliorations", en: "⚙️ Upgrades" },
        shopTabSkins: { fr: "🎨 Skins", en: "🎨 Skins" },
        shopTabTrails: { fr: "🌈 Traînées", en: "🌈 Trails" },
        upgradePuissanceName: { fr: "Puissance", en: "Power" },
        upgradePuissanceDesc: { fr: "Augmente la force maximale de ton lancer.", en: "Increases the maximum force of your throw." },
        upgradeVitesseName: { fr: "Vitesse", en: "Speed" },
        upgradeVitesseDesc: { fr: "Réduit la résistance : la trousse vole plus loin.", en: "Reduces drag: the pencil case flies further." },
        levelShort: { fr: "Niv. ", en: "Lvl " },
        equip: { fr: "Équiper", en: "Equip" },
        equipped: { fr: "Équipée", en: "Equipped" },
        leaderboardTitle: { fr: "🏆 Classement mondial", en: "🏆 Global leaderboard" },
        onlineConnecting: { fr: "Connexion...", en: "Connecting..." },
        onlineConnected: { fr: "En ligne ✅", en: "Online ✅" },
        onlineOfflineNoConfig: { fr: "Hors ligne (Firebase non configuré)", en: "Offline (Firebase not configured)" },
        onlineOfflineFailed: { fr: "Hors ligne (connexion échouée)", en: "Offline (connection failed)" },
        leaderboardUnavailable: { fr: "Classement indisponible hors ligne.", en: "Leaderboard unavailable offline." },
        leaderboardLoading: { fr: "Chargement...", en: "Loading..." },
        leaderboardEmpty: { fr: "Aucun score pour l'instant, sois le premier !", en: "No scores yet, be the first!" },
        leaderboardError: { fr: "Impossible de charger le classement.", en: "Couldn't load the leaderboard." },
        pseudoLabel: { fr: "✏️ Pseudo : ", en: "✏️ Nickname: " },
        pseudoPrompt: { fr: "Ton pseudo pour le classement :", en: "Your nickname for the leaderboard:" },
        tutorialSkip: { fr: "Passer ✕", en: "Skip ✕" },
        tutorialNext: { fr: "Suivant", en: "Next" },
        tutorialDone: { fr: "C'est parti !", en: "Let's go!" },
    };

    // Renvoie le texte dans la langue active pour une clé du dictionnaire ci-dessus
    // Nommée "tr" (pas "t") pour ne pas entrer en collision avec les variables
    // locales "t" utilisées un peu partout pour le temps écoulé (lockPower,
    // lockAccuracyAndLaunch, updateMeterUI...).
    function tr(key) {
        const entry = STRINGS[key];
        return entry ? (entry[save.lang] || entry.fr) : key;
    }

    // Met à jour tout le texte statique du HTML (attribut data-i18n) ainsi que
    // le bouton de langue. Les textes générés en JS se retraduisent tout
    // seuls la prochaine fois qu'ils sont (re)dessinés (hints, cartes boutique...).
    function applyLanguage() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
            el.textContent = tr(el.getAttribute("data-i18n"));
        });
        document.getElementById("btn-lang").textContent = save.lang === "en" ? "EN" : "FR";
    }

    /* =========================================================
       SOMMAIRE DU FICHIER
       1. Constantes de jeu (physique, échelle, sauvegarde)
       2. Données statiques (mondes, skins)
       3. Sauvegarde (localStorage)
       4. Notification "toast"
       5. Sons (WebAudio, sans fichiers audio) et musique de fond
       6. Navigation entre les 3 écrans
       7. Écran menu
       8. Écran boutique
       9. Écran de jeu : état + mécanique de lancer
       10. Rendu du décor (canvas) : bâtiments, arbres, craie
       11. Rendu de la trousse + boucle principale du jeu
       12. Firebase : auth anonyme, sauvegarde cloud, classement en ligne
       13. Tutoriel (une seule fois pour les nouveaux joueurs)
       14. Initialisation
       ========================================================= */

    /* ============ 1. CONSTANTES DE JEU ============ */
    const SAVE_KEY = "bullyTrousseSave_v1";
    const SCALE = 12;   // nombre de pixels représentant 1 mètre à l'écran
    const BASE_G = 950; // gravité (px/s²) avec un niveau de Vitesse à 0
    const BASE_V0 = 480; // vitesse initiale (px/s) avec Puissance à 0 et charge à 100%

    // Easter egg "vers l'espace" : lancer avec une puissance quasi max ET une
    // précision verrouillée tout au début de la barre (zone verte). Voir
    // lockAccuracyAndLaunch() pour la détection et gameLoop() pour la séquence.
    const SPACE_EGG_POWER_MIN = 0.9;      // lockedPower doit être proche du maximum (1.0)
    const SPACE_EGG_ACCURACY_MAX = -0.6;  // value doit être très à gauche (zone verte du début)
    const CLOUD_TRANSITION_DURATION = 0.8; // secondes, nuages qui cachent le changement de décor
    const SPACE_FLOAT_DURATION = 1.3;      // secondes, flottement avant le QTE
    const QTE_RING_COUNT = 3;              // nombre d'anneaux dans la séquence du QTE
    const QTE_DURATION = 0.9;              // secondes pendant lesquelles CHAQUE anneau rétrécit
    const QTE_RING_START = 110;            // rayon de départ de l'anneau qui rétrécit (px)
    const QTE_RING_TARGET = 46;            // rayon de l'anneau-cible fixe (px)
    const QTE_RING_TOLERANCE = 15;         // marge acceptée autour de la cible pour réussir
    const SPACE_BOOST_VX = 2600;           // vitesse folle horizontale si tous les anneaux sont réussis
    const SPACE_BOOST_VY = 150;

    /* ============ 2. DONNÉES STATIQUES ============ */
    // Les mondes futurs sont déjà prévus dans la liste : il suffit de passer
    // "unlocked" à true et d'ajouter un décor pour en activer un nouveau.
    const WORLDS = [
        { id: "cour", name: "Cour d'école", emoji: "🏫", unlocked: true },
        { id: "plage", name: "Plage", emoji: "🏖️", unlocked: false },
        { id: "ville", name: "Ville", emoji: "🏙️", unlocked: false },
    ];

    // Chaque skin réutilise la même image (trousse-skin-1.png) mais applique
    // un filtre CSS/canvas différent pour changer les couleurs, plus un bonus
    // de statistiques ajouté par-dessus les niveaux achetés en boutique.
    const SKINS = [
        {
            id: "classique", name: "Trousse Classique", cost: 0,
            desc: "La trousse de base, fidèle au poste.",
            bonusPuissance: 0, bonusVitesse: 0, filter: "none"
        },
        {
            id: "doree", name: "Trousse Dorée", cost: 400,
            desc: "+2 Puissance. Brille de mille feux.",
            bonusPuissance: 2, bonusVitesse: 0, filter: "sepia(0.6) saturate(4) hue-rotate(-10deg) brightness(1.15)"
        },
        {
            id: "glacee", name: "Trousse Glacée", cost: 1200,
            desc: "+3 Vitesse. Fraîche comme un glaçon.",
            bonusPuissance: 0, bonusVitesse: 3, filter: "hue-rotate(150deg) saturate(2) brightness(1.1)"
        },
        {
            id: "feu", name: "Trousse de Feu", cost: 3200,
            desc: "+3 Puissance, +2 Vitesse. Ça chauffe !",
            bonusPuissance: 3, bonusVitesse: 2, filter: "hue-rotate(-60deg) saturate(3) brightness(1.05)"
        },
        {
            id: "arcenciel", name: "Trousse Arc-en-ciel", cost: 9000,
            desc: "+5 Puissance, +5 Vitesse. La légende ultime.",
            bonusPuissance: 5, bonusVitesse: 5, filter: "rainbow" // cas spécial : géré par rainbowOrFilter()
        },
    ];

    // Traînée dessinée derrière la trousse pendant le vol (voir drawTrail).
    // "rgb" est une chaîne "r,g,b" réutilisée dans une rgba() ; le cas "rainbow"
    // est géré à part (teinte qui tourne avec le temps, comme le skin arc-en-ciel).
    const TRAILS = [
        { id: "blanche", name: "Traînée Blanche", cost: 0, desc: "La traînée de base, offerte.", rgb: "255,255,255" },
        { id: "doree", name: "Traînée Dorée", cost: 300, desc: "Un sillage doré et scintillant.", rgb: "255,210,63" },
        { id: "glacee", name: "Traînée Glacée", cost: 800, desc: "Un sillage bleu glacial.", rgb: "120,200,255" },
        { id: "feu", name: "Traînée de Feu", cost: 2000, desc: "Un sillage rouge ardent.", rgb: "255,110,60" },
        { id: "arcenciel", name: "Traînée Arc-en-ciel", cost: 6000, desc: "Un sillage qui change de couleur en continu.", rgb: "rainbow" },
    ];
    function getTrail(id) { return TRAILS.find(t => t.id === id) || TRAILS[0]; }

    /* ============ 3. SAUVEGARDE (localStorage) ============ */
    function defaultSave() {
        return {
            money: 0,
            puissanceLevel: 0,
            vitesseLevel: 0,
            bestDistance: 0,
            ownedSkins: ["classique"],
            equippedSkin: "classique",
            musicMuted: false,
            pseudo: "", // généré automatiquement à la première connexion Firebase
            tutorialSeen: false, // passe à true dès que le tutoriel a été vu ou passé
            milestoneReached: 0, // nombre de paliers de 100m déjà récompensés (0 = aucun)
            ownedTrails: ["blanche"],
            equippedTrail: "blanche",
            theme: "dark", // "dark" ou "light", voir applyTheme()
            lang: "", // "fr" ou "en" ; vide = pas encore choisi, détecté au premier lancement
        };
    }

    let save = loadSave();

    function loadSave() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return defaultSave();
            const parsed = JSON.parse(raw);
            // Object.assign avec defaultSave() en base : si on ajoute un nouveau
            // champ de sauvegarde plus tard, les anciennes parties ne cassent pas.
            return Object.assign(defaultSave(), parsed);
        } catch (e) {
            return defaultSave();
        }
    }

    function persist() {
        localStorage.setItem(SAVE_KEY, JSON.stringify(save));
        pushCloudSave(); // best-effort, ne fait rien si Firebase n'est pas connecté
    }

    function getSkin(id) { return SKINS.find(s => s.id === id) || SKINS[0]; }

    // Stat totale = niveau acheté en boutique + bonus du skin équipé
    function totalPuissance() {
        return save.puissanceLevel + getSkin(save.equippedSkin).bonusPuissance;
    }
    function totalVitesse() {
        return save.vitesseLevel + getSkin(save.equippedSkin).bonusVitesse;
    }

    // Coût d'amélioration : croissance exponentielle pour garder une
    // progression satisfaisante sans que ça devienne gratuit trop vite
    function upgradeCost(level) {
        return Math.round(50 * Math.pow(1.55, level));
    }

    /* ============ 4. NOTIFICATION "TOAST" ============ */
    const toastEl = document.getElementById("toast");
    let toastTimer = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    /* ============ 5. SONS ET MUSIQUE DE FOND ============ */
    // On génère des petits bips synthétiques à la volée avec l'API WebAudio,
    // pas besoin d'assets .mp3/.wav supplémentaires.
    let audioCtx = null;
    function ensureAudio() {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        return audioCtx;
    }
    function beep(freq, dur, type, vol) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.value = freq;
        gain.gain.value = vol || 0.15;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur); // fondu de sortie
        osc.start(now);
        osc.stop(now + dur);
    }
    function sfxCharge() { beep(300, 0.08, "square", 0.05); }
    function sfxLaunch() { beep(180, 0.25, "sawtooth", 0.12); beep(500, 0.15, "sine", 0.08); }
    function sfxLand() { beep(90, 0.3, "triangle", 0.18); }
    function sfxBuy() { beep(700, 0.12, "sine", 0.1); beep(900, 0.15, "sine", 0.1); }
    function sfxError() { beep(140, 0.15, "square", 0.1); }
    function sfxRecord() { beep(600, 0.1, "sine", 0.12); beep(800, 0.1, "sine", 0.12); beep(1000, 0.2, "sine", 0.12); }
    function sfxSpace() { beep(200, 0.5, "sine", 0.1); beep(900, 0.4, "sine", 0.06); }
    function sfxCrash() { beep(60, 0.4, "sawtooth", 0.2); beep(40, 0.5, "square", 0.15); }

    // Musique de fond en boucle. Les navigateurs bloquent la lecture audio tant
    // qu'il n'y a pas eu d'interaction de l'utilisateur : on démarre donc la
    // lecture au tout premier clic/tap détecté n'importe où sur la page, puis
    // on ne s'en occupe plus (l'écouteur ne se déclenche qu'une seule fois).
    const bgMusic = document.getElementById("bg-music");
    const muteBtn = document.getElementById("btn-mute");
    bgMusic.volume = 0.35;

    function applyMuteState() {
        bgMusic.muted = save.musicMuted;
        muteBtn.textContent = save.musicMuted ? "🔇" : "🔊";
    }
    applyMuteState();

    function tryStartMusic() {
        bgMusic.play().then(() => {
            document.removeEventListener("pointerdown", tryStartMusic);
        }).catch(() => { /* toujours bloqué : on retentera au prochain clic */ });
    }
    document.addEventListener("pointerdown", tryStartMusic);

    muteBtn.addEventListener("click", () => {
        save.musicMuted = !save.musicMuted;
        persist();
        applyMuteState();
    });

    // Thème clair/sombre : ne change que l'interface (menus, boutique...), le
    // décor du jeu lui-même garde toujours ses propres couleurs (voir la note
    // au-dessus de :root dans le CSS).
    const themeBtn = document.getElementById("btn-theme");
    function applyTheme() {
        document.documentElement.setAttribute("data-theme", save.theme);
        themeBtn.textContent = save.theme === "light" ? "☀️" : "🌙";
    }
    applyTheme();
    themeBtn.addEventListener("click", () => {
        save.theme = save.theme === "light" ? "dark" : "light";
        persist();
        applyTheme();
    });

    /* ============ 6. NAVIGATION ENTRE LES 3 ÉCRANS ============ */
    const screens = {
        menu: document.getElementById("screen-menu"),
        game: document.getElementById("screen-game"),
        shop: document.getElementById("screen-shop"),
        leaderboard: document.getElementById("screen-leaderboard"),
    };
    // Ajoute/retire simplement la classe "active" (voir le CSS plus haut) et
    // rafraîchit le contenu de l'écran qu'on vient d'afficher.
    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove("active"));
        screens[name].classList.add("active");
        if (name === "menu") refreshMenu();
        if (name === "shop") refreshShop();
        if (name === "game") resetThrow();
        if (name === "leaderboard") refreshLeaderboardScreen();
    }

    /* ============ 7. ÉCRAN MENU ============ */
    function refreshMenu() {
        document.getElementById("menu-money").textContent = save.money;
        document.getElementById("menu-puissance").textContent = totalPuissance();
        document.getElementById("menu-vitesse").textContent = totalVitesse();
        document.getElementById("menu-record").textContent = save.bestDistance.toFixed(1) + " m";
        document.getElementById("trousse-preview-img").style.filter = rainbowOrFilter(getSkin(save.equippedSkin).filter, performance.now());
    }

    // Le skin "rainbow" n'a pas un filtre fixe : la teinte tourne en fonction
    // du temps écoulé pour un effet arc-en-ciel animé.
    function rainbowOrFilter(filter, t) {
        if (filter === "rainbow") {
            const hue = Math.floor((t / 15) % 360);
            return "hue-rotate(" + hue + "deg) saturate(2.2) brightness(1.1)";
        }
        return filter;
    }

    // Construit les cartes de mondes en bas du menu (un seul déblocable pour l'instant)
    function buildWorldsRow() {
        const row = document.getElementById("worlds-row");
        row.innerHTML = "";
        WORLDS.forEach((w, idx) => {
            const card = document.createElement("div");
            card.className = "world-card" + (w.unlocked ? "" : " locked") + (idx === 0 ? " selected" : "");
            card.innerHTML = '<div class="emoji">' + w.emoji + '</div><div class="name">' + w.name + '</div>';
            card.addEventListener("click", () => {
                if (!w.unlocked) {
                    showToast("🔒 " + w.name + tr("worldLocked"));
                    sfxError();
                }
            });
            row.appendChild(card);
        });
    }

    // Boucle légère (juste pour l'image de prévisualisation) qui met à jour
    // le filtre rainbow tant qu'on est sur le menu ; s'arrête toute seule
    // dès qu'on quitte l'écran (voir la condition au tout début).
    let menuPreviewRAF = null;
    function animateMenuPreview() {
        if (!screens.menu.classList.contains("active")) return;
        const img = document.getElementById("trousse-preview-img");
        img.style.filter = rainbowOrFilter(getSkin(save.equippedSkin).filter, performance.now());
        menuPreviewRAF = requestAnimationFrame(animateMenuPreview);
    }

    /* ============ 8. ÉCRAN BOUTIQUE ============ */
    let currentTab = "upgrades"; // "upgrades" ou "skins"

    function refreshShop() {
        document.getElementById("shop-money").textContent = save.money;
        renderShopTab();
    }

    // Petit "pop" visuel joué sur toute la liste juste après un achat/équipement,
    // pour donner un retour clair en plus du son et du toast de confirmation.
    function playPurchasePop() {
        const body = document.getElementById("shop-body");
        body.classList.remove("just-bought");
        void body.offsetWidth; // force le navigateur à relancer l'animation même si la classe était déjà présente
        body.classList.add("just-bought");
    }

    // Reconstruit entièrement la liste de cartes selon l'onglet actif
    function renderShopTab() {
        const body = document.getElementById("shop-body");
        body.innerHTML = "";
        if (currentTab === "upgrades") {
            body.appendChild(buildUpgradeCard(
                "💪", tr("upgradePuissanceName"), save.puissanceLevel,
                tr("upgradePuissanceDesc"),
                () => {
                    const cost = upgradeCost(save.puissanceLevel);
                    if (save.money >= cost) {
                        save.money -= cost;
                        save.puissanceLevel++;
                        persist();
                        sfxBuy();
                        showToast("✅ " + tr("upgradePuissanceName") + " (" + tr("levelShort") + save.puissanceLevel + ")");
                        refreshShop();
                        playPurchasePop();
                    } else {
                        sfxError();
                        showToast(tr("notEnoughMoney"));
                    }
                }
            ));
            body.appendChild(buildUpgradeCard(
                "⚡", tr("upgradeVitesseName"), save.vitesseLevel,
                tr("upgradeVitesseDesc"),
                () => {
                    const cost = upgradeCost(save.vitesseLevel);
                    if (save.money >= cost) {
                        save.money -= cost;
                        save.vitesseLevel++;
                        persist();
                        sfxBuy();
                        showToast("✅ " + tr("upgradeVitesseName") + " (" + tr("levelShort") + save.vitesseLevel + ")");
                        refreshShop();
                        playPurchasePop();
                    } else {
                        sfxError();
                        showToast(tr("notEnoughMoney"));
                    }
                }

        } else if (currentTab === "skins") {
            SKINS.forEach(skin => body.appendChild(buildSkinCard(skin)));
        } else {

        }
    }

    // Crée une carte d'amélioration (Puissance ou Vitesse) avec son bouton d'achat
    function buildUpgradeCard(icon, name, level, desc, onBuy) {
        const cost = upgradeCost(level);
        const card = document.createElement("div");
        card.className = "upgrade-card";
        card.innerHTML =
            '<div class="icon">' + icon + '</div>' +
            '<div class="info"><h3>' + name + ' <span class="level-badge">' + tr("levelShort") + level + '</span></h3>' +
            '<p>' + desc + '</p></div>';

        btn.className = "btn small";
        btn.textContent = cost + " $";
        btn.addEventListener("click", onBuy);
        card.appendChild(btn);
        return card;

    // Crée une carte de skin : bouton "Prix" si pas acheté, "Équiper" si possédé
    // mais pas équipé, ou juste "Équipée" (désactivé) si c'est le skin actuel
    function buildSkinCard(skin) {
        const owned = save.ownedSkins.includes(skin.id);
        const equipped = save.equippedSkin === skin.id;
        const card = document.createElement("div");
        card.className = "skin-card";
        const img = document.createElement("img");
        img.src = "trousse-skin-1.png";

        const info = document.createElement("div");

        if (skin.bonusVitesse) bonusText.push("+" + skin.bonusVitesse + " Vitesse");
        info.innerHTML = "<h3>" + skin.name + (equipped ? ' <span class="level-badge">' + tr("equipped").toUpperCase() + '</span>' : '') + "</h3><p>" + skin.desc + (bonusText.length ? " (" + bonusText.join(", ") + ")" : "") + "</p>";
        card.appendChild(info);

        const btn = document.createElement("button");

                save.equippedSkin = skin.id;

                sfxBuy();
                showToast("✅ " + skin.name + " équipée !");
                refreshShop();
                playPurchasePop();
            });
        } else {
            btn.textContent = skin.cost + " $";

                    save.money -= skin.cost;

                    save.equippedSkin = skin.id;

                    showToast("✅ " + skin.name + " achetée !");

                    playPurchasePop();
                } else {
                    sfxError();
                    showToast(tr("notEnoughMoney"));

            });

        card.appendChild(btn);
        return card;

    // Crée une carte de traînée : même logique que buildSkinCard (Prix / Équiper / Équipée)

    // Bascule entre les onglets "Améliorations", "Skins" et "Traînées"
    const shopTabs = { upgrades: "tab-upgrades", skins: "tab-skins", trails: "tab-trails" };
    function switchShopTab(name) {
        currentTab = name;
        Object.entries(shopTabs).forEach(([key, id]) => {
            document.getElementById(id).classList.toggle("active", key === name);
        });
