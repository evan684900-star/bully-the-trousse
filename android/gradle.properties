# Nécessaire dès qu'une dépendance AndroidX (Compose, Firebase, etc.) est présente
# dans le classpath, sinon Gradle refuse de compiler avec l'erreur
# "Configuration ... contains AndroidX dependencies, but android.useAndroidX
# property is not enabled".
android.useAndroidX=true

# Évite que Gradle essaie de réécrire (jetifier) d'anciennes libs pré-AndroidX :
# ce projet n'en dépend d'aucune, donc pas nécessaire et ça accélère le build.
android.enableJetifier=false
